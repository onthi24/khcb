
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lí KHCB và dữ liệu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #1abc9c;
            --primary-blue: #3498db;
            --primary-orange: #e67e22;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #fdfdfd; 
            margin: 0;
            padding: 20px;
            font-size: 16px;
            overflow-x: hidden;
        }

        /* --- THANH ĐIỀU HƯỚNG TỔNG (TOP NAVBAR) --- */
        .top-navbar {
            max-width: 1100px;
            margin: 0 auto 25px auto;
            width: 100%;
            background-color: #f1f4f6;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px;
            object-fit: contain;
            display: block;
        }

        /* Nút ba gạch ☰ mở menu di động (Ẩn mặc định trên PC) */
        .mobile-menu-btn {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
            padding: 10px;
        }

        /* Khối chứa danh sách Menu hiển thị nằm ngang trên PC */
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 5px;
        }

        .nav-item-wrap {
            position: relative;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            padding: 14px 15px;
            font-weight: 500;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            border-bottom: 4px solid transparent;
            cursor: pointer;
        }

        /* Vết gạch chân màu đen dưới mục đang chọn trên PC */
        .nav-item.active {
            font-weight: bold;
            background-color: #fff;
            border-bottom: 4px solid #000;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
        }

        /* Nút Close X ẩn mặc định trên PC */
        .mobile-close-btn { display: none; }

        /* --- PHẦN TÌM KIẾM --- */
        .header-main {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 25px auto;
            width: 100%;
        }

        .search-box input {
            width: 270px; 
            padding: 10px 16px; 
            border-radius: 25px;
            border: 1px solid #c7d2d8;
            background: #f1f4f6;
            outline: none;
            font-size: 15px;
        }

        /* --- BỐ CỤC KHỐI BÀI HỌC CHÍNH --- */
        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .column-header {
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Màu sắc đặc trưng của các khối danh mục */
        .bg-green { background: #1a4d2e; }   
        .bg-blue { background: #78281f; }    
        .bg-orange { background: #B5782A; }  

        .menu-block {
            display: flex;
            flex-direction: column;
        }

        .item-card {
            background: #fff;
            padding: 14px 18px; 
            border-radius: 16px;
            border: 1.5px solid #b5b5b5; 
            text-decoration: none;
            display: block;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            transition: 0.2s;
            cursor: pointer;
        }

        .item-card:hover {
            background-color: #f8fafc;
            border-color: #78281f;
        }

        .item-card h2 {
            margin: 0;
            font-weight: 700; 
            color: #222; 
            font-size: 18px;
        }

        /* DROPDOWN MENU CON TỪ GOOGLE SHEET */
        .sheet-dropdown {
            margin-top: -6px;
            margin-bottom: 5px;
            padding: 10px 18px 6px 18px;
            background: #ffffff;
            border-radius: 0 0 16px 16px;
            border: 1.5px solid #b5b5b5;
            border-top: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            display: none;
        }

        .sheet-dropdown a {
            display: block;
            text-decoration: none;
            color: #4a5568;
            padding: 8px 0;
            font-size: 15px;
            border-bottom: 1px solid #f1f4f6;
            transition: 0.2s;
        }

        .sheet-dropdown a:last-child {
            border-bottom: none;
        }

        .sheet-dropdown a:hover {
            color: #3498db;
            padding-left: 6px;
        }

        /* --- FOOTER ACTIONS --- */
        .footer-action {
            margin: 40px auto 20px auto;
            max-width: 1100px;
            width: 100%;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .btn-register {
            background: linear-gradient(to bottom, #d4af37, #a67c00);
            color: #fff;
            padding: 14px 35px; 
            border-radius: 25px;
            border: 1px solid #8e6f3e;
            font-weight: bold;
            cursor: pointer;
        }

        .link-detail { font-weight: bold; text-decoration: none; font-size: 15px; text-transform: uppercase; } 
        .copyright { color: #999; font-size: 14px; padding-left: 20px; max-width: 1100px; margin: 0 auto 20px auto; }

        /* ========================================================
           📱 ĐIỀU CHỈNH GIAO DIỆN TRÊN ĐIỆN THOẠI (ĐÃ THU NHỎ CHỮ CHUẨN)
           ======================================================== */
        @media (max-width: 768px) {
            body { padding: 0px; } 

            .top-navbar {
                justify-content: flex-start; 
                gap: 15px;
                padding: 10px 15px;
                background-color: #f4f6f9;
                border-radius: 0;
                margin-bottom: 15px;
            }

            .mobile-menu-btn {
                display: block; 
            }

            .logo-box {
                width: auto;
                margin-bottom: 0;
            }

            .nav-menu {
                position: fixed;
                top: 0;
                left: -280px; 
                width: 260px;
                height: 100%;
                background-color: #f4f6f8;
                box-shadow: 4px 0 12px rgba(0,0,0,0.15);
                z-index: 99999;
                flex-direction: column;
                padding-top: 60px;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                gap: 0;
            }

            .nav-menu.open {
                left: 0 !important;
            }

            .mobile-close-btn {
                display: block !important;
                position: absolute;
                top: 15px;
                left: 20px;
                font-size: 24px;
                cursor: pointer;
                color: #222;
                font-weight: bold;
            }

            .nav-item-wrap { width: 100%; }

            /* Thu nhỏ font chữ thanh menu dọc mobile */
            .nav-item {
                padding: 12px 20px;
                font-size: 15px; 
                color: #222;
                font-weight: 600;
                border-bottom: none;
                border-left: 5px solid transparent;
                justify-content: space-between; 
                width: 100%;
                background-color: transparent;
            }

            .nav-item.active {
                background-color: #e2e8f0;
                border-left: 6px solid #000 !important;
                border-bottom: none !important;
                font-weight: bold;
            }

            .header-main {
                flex-direction: column;
                padding: 0 15px;
                gap: 12px;
                align-items: flex-start; 
            }

            .search-box { width: 100%; padding: 0 15px; }
            .search-box input { width: 100%; border-radius: 20px; font-size: 14px; padding: 8px 14px; }

            .container { flex-direction: column; gap: 8px; padding: 0; margin-top: 5px; }
            
            /* Thu nhỏ chữ tiêu đề khối bài học trên mobile */
            .column-header { border-radius: 0; font-size: 15px; padding: 12px; text-align: center; }
            
            .item-card { border-radius: 0; border-left: none; border-right: none; padding: 12px; }
            
            /* Thu nhỏ chữ bài học con trên mobile */
            .item-card h2 { font-size: 14px; text-align: center; font-weight: 600; }
            
            /* Thu nhỏ link con từ google sheet */
            .sheet-dropdown a { text-align: center; font-size: 13.5px; padding: 7px 0; }

            /* Điều chỉnh chân trang mobile */
            .footer-action { flex-direction: column; align-items: center; gap: 15px; text-align: center; padding: 15px; margin: 30px auto 15px auto; }
            .btn-register { width: 100%; padding: 12px 20px; font-size: 14px; }
            .link-detail { font-size: 14px; }
            .copyright { text-align: center; font-size: 12px; padding-left: 0; }
        }
    </style>
    
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSGSAfaa7s68I0cwNes4pEDCOHUFynPUujt-dUHUEG3HtrdfEPpNDX2Ejtv4NZZ5FcKTtOdAaWLGiCm/pub?gid=0&single=true&output=tsv";

        function normalizeGoogleDriveLink(rawUrl) {
            if (!rawUrl || rawUrl.trim() === "" || rawUrl.trim() === "#") return "#";
            let folderIdMatch = rawUrl.match(/folders\/([a-zA-Z0-9-_]{33,})/);
            if (folderIdMatch && folderIdMatch[1]) {
                return "https://drive.google.com/drive/folders/" + folderIdMatch[1] + "?usp=drive_link";
            }
            return rawUrl;
        }

        window.onload = function() {
            fetch(CSV_URL)
                .then(response => response.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    
                    // Bước 1: Tạo tiêu đề mục lớn
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let columns = lines[i].split('\t');
                        if (columns.length >= 2) {
                            let id = columns[0].trim().toUpperCase().replace(/\s+/g, '');
                            let textDisplay = columns[1].trim().replace(/^"|"$/g, '');
                            
                            let idParts = id.split('_');
                            if (idParts.length === 2) {
                                let columnGroup = idParts[0]; 
                                let colElement = document.getElementById('col-' + columnGroup);
                                
                                if (colElement) {
                                    let blockDiv = document.createElement('div');
                                    blockDiv.className = 'menu-block';
                                    
                                    let cardDiv = document.createElement('div');
                                    cardDiv.className = 'item-card';
                                    cardDiv.setAttribute('onclick', `toggleMenu('drop-${id}')`);
                                    cardDiv.innerHTML = `<h2>${textDisplay}</h2>`;
                                    
                                    let dropdownDiv = document.createElement('div');
                                    dropdownDiv.className = 'sheet-dropdown';
                                    dropdownDiv.id = 'drop-' + id;
                                    
                                    blockDiv.appendChild(cardDiv);
                                    blockDiv.appendChild(dropdownDiv);
                                    colElement.appendChild(blockDiv);
                                }
                            }
                        }
                    }

                    // Bước 2: Nhét các đường Link con
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let columns = lines[i].split('\t');
                        if (columns.length >= 3) {
                            let id = columns[0].trim().toUpperCase().replace(/\s+/g, '');
                            let textDisplay = columns[1].trim().replace(/^"|"$/g, '');
                            let url = columns[2].trim().replace(/^"|"$/g, '');
                            
                            let idParts = id.split('_');
                            if (idParts.length >= 3) {
                                let parentId = 'drop-' + idParts[0] + '_' + idParts[1]; 
                                let targetDropdown = document.getElementById(parentId);
                                
                                if (targetDropdown) {
                                    let aTag = document.createElement('a');
                                    aTag.id = id;
                                    aTag.href = normalizeGoogleDriveLink(url);
                                    aTag.target = "_blank";
                                    aTag.textContent = textDisplay;
                                    targetDropdown.appendChild(aTag);
                                }
                            }
                        }
                    }

                    // Bước 3: Điền chữ thông báo nếu mục đó trống
                    document.querySelectorAll('.sheet-dropdown').forEach(div => {
                        if(div.innerHTML.trim() === '') {
                            div.innerHTML = '<span style="color:#95a5a6; font-size:13px; display:block; padding:3px 10px; font-style: italic; text-align:center;">Chưa có dữ liệu con</span>';
                        }
                    });
                })
                .catch(error => {
                    console.error("Lỗi khi tải dữ liệu từ Google Sheet:", error);
                });

            // Nhận diện kích hoạt class Active cho Menu
            const currentUrl = window.location.href;
            document.querySelectorAll('.nav-menu .nav-item').forEach(el => el.classList.remove('active'));
            if (currentUrl.includes('/video/')) {
                document.getElementById('menu-video').classList.add('active');
            } else {
                document.getElementById('menu-home').classList.add('active');
            }

            // Click ra ngoài đóng menu di động
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const menu = document.getElementById('mobileNavMenu');
                    if (!menu.contains(e.target)) {
                        menu.classList.remove('open');
                    }
                }
            });
        };

        function toggleMenu(id) {
            let menu = document.getElementById(id);
            if (!menu) return;
            let isCurrentlyOpen = (menu.style.display === "block");
            document.querySelectorAll(".sheet-dropdown").forEach(m => {
                m.style.display = "none";
            });
            menu.style.display = isCurrentlyOpen ? "none" : "block";
        }

        function openMobileMenu(e) {
            e.stopPropagation();
            document.getElementById('mobileNavMenu').classList.add('open');
        }

        function closeMobileMenu(e) {
            e.stopPropagation();
            document.getElementById('mobileNavMenu').classList.remove('open');
        }
    </script>
</head>
<body>

    <div class="top-navbar">
        <div class="mobile-menu-btn" onclick="openMobileMenu(event)"><i class="fa fa-bars"></i></div>

        <div class="logo-box">
            <img src="https://raw.githubusercontent.com/onthi24/khcb/main/KHCB%20-%20n%E1%BB%81n%20trong.png" alt="KHCB LOGO" class="logo-img">
        </div>
        
        <div class="nav-menu" id="mobileNavMenu">
            <div class="mobile-close-btn" onclick="closeMobileMenu(event)"><i class="fa fa-times"></i></div>

            <div class="nav-item-wrap">
                <a href="#" class="nav-item" id="menu-home">Trang chủ</a>
            </div>

            <div class="nav-item-wrap">
                <a href="https://onthi24.github.io/khcb/video/video-kho.html" class="nav-item" id="menu-video">Video bài giảng</a>
            </div>
        </div>
    </div>

    <div class="header-main">
        <form class="search-box" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Tìm qua Google...">
        </form>
    </div>

    <div class="container">
        <div class="column" id="col-I">
            <div class="column-header bg-green">1. Chương trình đào tạo</div>
        </div>

        <div class="column" id="col-II">
            <div class="column-header bg-blue">2. Quản lí hoạt động khoa</div>
        </div>

        <div class="column" id="col-III">
            <div class="column-header bg-orange">3. Hoạt động khác</div>
        </div>
    </div>

    <div class="footer-action">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSePx34NyWHvOe2ulC5mNf0UDnNjiNXl08puh1G5u6qKyCnRIw/viewform" target="_blank" style="text-decoration: none;">
            <button class="btn-register">BÁO CÁO VẮNG</button>
        </a>
        <a href="http://dhcd.edu.vn/b/Tin-Khac/KHOA-KHOA-HOC-CO-BAN-VA-DU-LIEU.html" target="_blank" class="link-detail" style="color: #78281f;">
            giới thiệu về KHCB và dữ liệu
        </a>
    </div>

    <div class="copyright">© 2026 Quản lí KHCB và dữ liệu</div>

</body>
</html>
